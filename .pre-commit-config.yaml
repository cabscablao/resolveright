repos:
  # Secret scanning. detect-secrets is pure Python (gitleaks.exe is flagged by the antivirus here).
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: ^(uv\.lock|\.env\.example)$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
